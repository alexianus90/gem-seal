name: Upload to TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gem-seal-testflight
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Sign, archive, and upload
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          GEM_SEAL_ADMOB_APP_ID: ${{ vars.GEM_SEAL_ADMOB_APP_ID }}
          GEM_SEAL_REWARDED_AD_UNIT_ID: ${{ vars.GEM_SEAL_REWARDED_AD_UNIT_ID }}
          GEM_SEAL_STORE_URL: ${{ vars.GEM_SEAL_STORE_URL }}
          GEM_SEAL_PRIVACY_URL: ${{ vars.GEM_SEAL_PRIVACY_URL }}
          GEM_SEAL_SUPPORT_URL: ${{ vars.GEM_SEAL_SUPPORT_URL }}
        shell: bash
        run: |
          set -euo pipefail
          for name in IOS_CERTIFICATE_BASE64 IOS_PROFILE_BASE64 ASC_KEY_BASE64 ASC_KEY_ID ASC_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
          umask 077
          work="$(mktemp -d "$RUNNER_TEMP/gem-seal.XXXXXX")"
          keychain="$work/signing.keychain-db"
          profile_path=""
          cleanup() {
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            if [[ -n "$profile_path" ]]; then rm -f "$profile_path"; fi
            rm -rf "$work"
          }
          trap cleanup EXIT

          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 -D > "$work/distribution.p12"
          printf '%s' "$IOS_PROFILE_BASE64" | base64 -D > "$work/app.mobileprovision"
          printf '%s' "$ASC_KEY_BASE64" | base64 -D > "$work/AuthKey.p8"

          security cms -D -i "$work/app.mobileprovision" > "$work/profile.plist"
          uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$work/profile.plist")"
          team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$work/profile.plist")"
          app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$work/profile.plist")"
          bundle_id="com.alexianus.gemseal"
          if [[ "$app_id" != "$team.$bundle_id" ]]; then
            echo "::error::Use an App Store Connect profile for com.alexianus.gemseal."
            exit 1
          fi
          profile_dir="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profile_dir"
          profile_path="$profile_dir/$uuid.mobileprovision"
          cp "$work/app.mobileprovision" "$profile_path"

          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 1800 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$work/distribution.p12" -k "$keychain" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"

          ad_settings=()
          for name in GEM_SEAL_ADMOB_APP_ID GEM_SEAL_REWARDED_AD_UNIT_ID GEM_SEAL_STORE_URL GEM_SEAL_PRIVACY_URL GEM_SEAL_SUPPORT_URL; do
            if [[ -n "${!name}" ]]; then ad_settings+=("$name=${!name}"); fi
          done

          xcodebuild -project GemSeal.xcodeproj -scheme GemSeal \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$work/GemSeal.xcarchive" archive \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$team" \
            CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$uuid" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" ${ad_settings[@]+"${ad_settings[@]}"}

          cat > "$work/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$team</string>
            <key>provisioningProfiles</key><dict><key>$bundle_id</key><string>$uuid</string></dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive -archivePath "$work/GemSeal.xcarchive" \
            -exportPath "$work/export" -exportOptionsPlist "$work/ExportOptions.plist" \
            -allowProvisioningUpdates -authenticationKeyPath "$work/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
